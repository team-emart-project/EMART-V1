#
# connectionTimeZone=LOCAL, NOT serverTimezone=UTC.
#
# serverTimezone=UTC told the driver that every DATETIME in this database is
# UTC, so it shifted each LocalDateTime by the machine's offset on the way in
# and back out again. Round-tripping through THIS backend hid the problem -
# -5:30 on write, +5:30 on read - but the column ended up holding a different
# instant from the one the application had:
#
#     placeOrder() logged 16:03:22  ->  orders.order_date stored 10:33:22
#
# dotnet-backend writes DateTime.Now into the same column with no conversion
# at all, so the two backends disagreed about what the column MEANS. Reading a
# .NET-written order through this backend added 5:30 that was never there:
# an order placed at 15:55 showed as 21:25 in Order history, while the
# confirmation email - built in memory, before the driver ever saw it - said
# 15:55. Same order, two times, and only the email was right.
#
# LOCAL means "the database and the JVM are in the same zone, do not convert",
# which is true here and matches what .NET already does. Do not put
# serverTimezone back: it is also the deprecated spelling in Connector/J 8+.
spring.datasource.url=jdbc:mysql://localhost:3306/emart?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
