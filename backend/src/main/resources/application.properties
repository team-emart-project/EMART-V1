# Sent as the X-API-Key header. MUST equal emart.email.api-key in
# backend-email-microservice/src/main/resources/application.properties,
# or every notification comes back 401.
emart.email-service.api-key=${EMAIL_SERVICE_API_KEY:emart-local-dev-key}

# Short on purpose: the endpoint answers 202 without doing any real work, so
# anything slower than this means it is down or hung.
emart.email-service.connect-timeout-ms=3000
emart.email-service.read-timeout-ms=5000

