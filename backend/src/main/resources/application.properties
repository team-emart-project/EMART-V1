# ===== MySQL Database =====
# Run emart_schema.sql then emart_seed_data.sql BEFORE starting the app.
# allowPublicKeyRetrieval=true is REQUIRED here.
#
# MySQL 8/9 authenticate with caching_sha2_password. On a non-SSL connection the
# server must hand the driver its RSA public key to encrypt your password, and
# the driver refuses to accept that key unless this flag is set -> the error
# "Public Key Retrieval is not allowed".
#
# It appears to work without the flag right up until MySQL restarts: the server
# caches the password hash after a successful login and takes a fast path that
# needs no key exchange. Restarting MySQL clears that cache, so the next
# connection does the full handshake and fails.
#
# Safe on localhost. In production do NOT do this - use useSSL=true with a
# trusted server certificate instead, otherwise the key exchange is
# MITM-able.
