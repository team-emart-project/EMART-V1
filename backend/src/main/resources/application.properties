# ===== Module 4 (e-MART card) =====
# Approve card applications immediately.
#
# IMPORTANT: with this false a card sits at PENDING forever, because there is
# no admin approval module in this phase. That was the root cause of the
# "e-Points never update" bug - every downstream points check requires an
# APPROVED card. Only set this false once an approval workflow exists.
emart.card.auto-approve=true

# ===== Module 8 (Orders) =====
# NO TAX. The customer is charged exactly the price shown on the product card,
# so there is no rate to configure and total always equals subtotal.
#
# There is also no flat "point value" setting any more. The BRD's example
# ("$80 + 60 e-Points" instead of $120) is now modelled properly: product_master
# carries hybrid_cash_price + hybrid_points per product, so the combo price is
# whatever the catalogue says rather than a global conversion rate.

# ----- e-Points EARNING: tiered 2% - 5% of order value -----
# Only ACTIVE cardholders earn. Points are rounded DOWN.
#
#   under  5,000       ->  2%
#    5,000 -  24,999   ->  3%
#   25,000 -  74,999   ->  4%
#   75,000 and above   ->  5%
emart.points.earn.tier1-limit=5000
emart.points.earn.tier2-limit=25000
emart.points.earn.tier3-limit=75000
emart.points.earn.tier1-percentage=2
emart.points.earn.tier2-percentage=3
emart.points.earn.tier3-percentage=4
emart.points.earn.tier4-percentage=5

# ===== Module 6 (Cart) =====
# only e-MART cardholders may redeem e-Points against a cart line
emart.cart.require-cardholder-for-points=true

