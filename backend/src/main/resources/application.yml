spring:
  application:
    name: backend
  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/emart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'validate' = Hibernate checks the entities match the tables you already
      # created with emart_schema.sql, but never alters them. Safer than 'update'.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

emart:
  cart:
    # only cardholders may redeem e-Points against a cart line
    require-cardholder-for-points: true
