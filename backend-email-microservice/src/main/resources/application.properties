spring.application.name=backend-email-microservice

# ===== Server =====
# 8082, NOT 8080. Both backends bind 8080 (Spring Boot via server.port, .NET via
# the Kestrel endpoint in appsettings.json) and the Vite dev server holds 5173.
# Whichever backend you run, this service sits beside it on its own port.
server.port=8082

# ===== SMTP =====
#
# Gmail: the password below is an APP PASSWORD, not the account password.
# Generate one at https://myaccount.google.com/apppasswords (2-Step
# Verification must be on first). A normal Google password is rejected here.
#
# Both are overridable by environment variable, so a deployment never has to
# edit this file:  set MAIL_USERNAME=... and MAIL_PASSWORD=...
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rishirajchh121@gmail.com}
spring.mail.password=${MAIL_PASSWORD:zhujpwyonjijnoxd}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Without these a dead SMTP host does not fail - it HANGS, holding an email-*
# thread until the OS gives up minutes later. With retries on top, three stuck
# threads is most of the pool. Fail in seconds instead.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=10000

# ===== This service =====
#
# enabled=false  -> endpoint still returns 2xx, nothing is sent (status SKIPPED)
# dry-run=true   -> renders the message and LOGS it instead of sending
#
# START WITH dry-run=true. You get the exact HTML the customer would receive in
# the console, with no credentials and no mailbox to check. Flip it to false
# once the SMTP settings above are real.
emart.email.enabled=true
emart.email.dry-run=false

emart.email.from=${MAIL_USERNAME:rishirajchh121@gmail.com}
emart.email.from-name=e-MART
emart.email.subject-prefix=[e-MART]
emart.email.support-email=${MAIL_USERNAME:rishirajchh121@gmail.com}
emart.email.store-name=e-MART

# The currency symbol defaults to the rupee sign in EmailProperties. It is set
# in Java rather than here on purpose: a properties file that is ever saved as
# Windows-1252 turns the symbol into mojibake in every invoice.
# emart.email.currency-symbol=Rs.

# How hard to try before writing the message off. Each attempt is a fresh SMTP
# connection, so 3 x 5s connect timeout + 2 x 2s pause = ~19s worst case.
emart.email.max-attempts=3
emart.email.retry-delay-ms=2000

# ===== Shared secret =====
#
# Both backends must send this as the X-API-Key header:
#   backend        -> emart.email-service.api-key in application.properties
#   dotnet-backend -> EmailService:ApiKey in appsettings.json
# The three values must match. Leave BLANK to turn the check off entirely
# (the service logs a warning at startup when you do).
emart.email.api-key=${EMAIL_SERVICE_API_KEY:emart-local-dev-key}

# ===== Actuator =====
# /actuator/health is deliberately outside the API-key filter so a health check
# does not need the secret.
management.endpoints.web.exposure.include=health,info

# ===== Logging =====
logging.level.com.example.demo=DEBUG
# Uncomment to watch the raw SMTP conversation when a send is failing.
# logging.level.org.springframework.mail=DEBUG
# spring.mail.properties.mail.debug=true
